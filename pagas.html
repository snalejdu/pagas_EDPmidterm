<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Modern Event Portfolio</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:system-ui,sans-serif;
}

body{
  background:#0f172a;
  color:#e5e7eb;
  overflow-x:hidden;
}

section{
  min-height:100vh;
  padding:100px 8%;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

h1,h2{
  text-align:center;
  margin-bottom:20px;
}

.hero{
  background:linear-gradient(120deg,#2563eb,#9333ea);
  color:white;
  text-align:center;
}

.hero h1{
  font-size:3.5rem;
}

.menu-btn{
  position:fixed;
  top:20px;
  right:20px;
  font-size:30px;
  cursor:pointer;
  z-index:1001;
}

.sidebar{
  position:fixed;
  top:0;
  right:-280px;
  width:280px;
  height:100%;
  backdrop-filter:blur(12px);
  background:rgba(255,255,255,0.1);
  padding:40px 20px;
  transition:0.3s;
  z-index:1002;
}

.sidebar.open{
  right:0;
}

.sidebar a{
  display:block;
  color:white;
  text-decoration:none;
  font-size:18px;
  margin:20px 0;
}

.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.6);
  display:none;
}

.overlay.show{
  display:block;
}

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
}

.card{
  background:rgba(255,255,255,0.08);
  padding:25px;
  border-radius:16px;
  transition:0.3s;
}

.card.hover{
  transform:translateY(-10px) scale(1.05);
  background:rgba(255,255,255,0.15);
}

video{
  width:80%;
  margin:auto;
  border-radius:20px;
}

.reveal{
  opacity:0;
  transform:translateY(50px);
  transition:0.6s;
}

.reveal.active{
  opacity:1;
  transform:none;
}

.toggle{
  margin:auto;
  padding:12px 25px;
  border:none;
  border-radius:30px;
  cursor:pointer;
  font-size:16px;
}

.light{
  background:#f8fafc;
  color:#020617;
}

.light .card{
  background:#e5e7eb;
}
</style>
</head>

<body>

<div class="menu-btn">☰</div>

<div class="sidebar">
  <a href="#hero">Home</a>
  <a href="#about">About</a>
  <a href="#projects">Projects</a>
  <a href="#video">Video</a>
  <a href="#skills">Skills</a>
  <a href="#contact">Contact</a>
</div>

<div class="overlay"></div>

<section id="hero" class="hero">
  <h1>Modern Portfolio</h1>
  <p>Event-Driven Single Page Website</p>
</section>

<section id="about" class="reveal">
  <h2>About</h2>
  <p style="text-align:center;">Built using JavaScript events and modern UI design.</p>
</section>

<section id="projects">
  <h2>Projects</h2>
  <div class="cards">
    <div class="card">Project Alpha</div>
    <div class="card">Project Beta</div>
    <div class="card">Project Gamma</div>
  </div>
</section>

<section id="video">
  <h2>Featured Video</h2>
  <video muted controls>
    <source src="https://www.w3schools.com/html/mov_bbb.mp4">
  </video>
</section>

<section id="skills" class="reveal">
  <h2>Skills</h2>
  <p style="text-align:center;">HTML · CSS · JavaScript</p>
  <button class="toggle">Toggle Theme</button>
</section>

<section id="contact" class="reveal">
  <h2>Contact</h2>
  <p style="text-align:center;">portfolio@email.com</p>
</section>

<script>
window.addEventListener("scroll",()=>{
  document.querySelector(".hero").style.backgroundPositionY=window.scrollY*0.4+"px"
})

const sidebar=document.querySelector(".sidebar")
const menuBtn=document.querySelector(".menu-btn")
const overlay=document.querySelector(".overlay")

menuBtn.onclick=()=>{
  sidebar.classList.add("open")
  overlay.classList.add("show")
}

overlay.onclick=close

function close(){
  sidebar.classList.remove("open")
  overlay.classList.remove("show")
}

document.addEventListener("keydown",e=>{
  if(e.key==="Escape") close()
})

document.querySelectorAll(".card").forEach(c=>{
  c.onmouseenter=()=>c.classList.add("hover")
  c.onmouseleave=()=>c.classList.remove("hover")
})

const video=document.querySelector("video")
new IntersectionObserver(e=>{
  e.forEach(x=>x.isIntersecting?video.play():video.pause())
},{threshold:.6}).observe(video)

new IntersectionObserver(e=>{
  e.forEach(x=>x.isIntersecting&&x.target.classList.add("active"))
}).observe(document.querySelector("#about"))

document.querySelectorAll(".reveal").forEach(el=>{
  new IntersectionObserver(e=>{
    e.forEach(x=>x.isIntersecting&&x.target.classList.add("active"))
  }).observe(el)
})

document.querySelector(".toggle").onclick=()=>{
  document.body.classList.toggle("light")
}

window.addEventListener("resize",()=>{
  if(window.innerWidth>900) close()
})
</script>

</body>
</html>
